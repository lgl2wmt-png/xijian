name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

      - name: API health smoke
        run: |
          npx tsx server/index.ts &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/health >/dev/null; then
              echo "API ready"
              curl -sf http://127.0.0.1:8787/api/health
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          kill $PID || true
          echo "API failed to start"
          exit 1

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t xijian:ci .
